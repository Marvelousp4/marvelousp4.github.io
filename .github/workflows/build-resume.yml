name: Build V4 resume PDF
on:
  push:
    branches: [master]
    paths:
      - resume_source.tex
      - .github/workflows/build-resume.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build original V4 LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume_source.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Install PDF validation utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Validate PDF and copy to website
        run: |
          test -s resume_source.pdf
          test "$(pdfinfo resume_source.pdf | sed -n 's/^Pages:[[:space:]]*//p')" = "1"
          pdftotext resume_source.pdf - | grep -q 'TD-MPC'
          pdftotext resume_source.pdf - | grep -q 'Diffusion Policy'
          ! pdftotext resume_source.pdf - | grep -q 'Kurtosis'
          cp resume_source.pdf resume.pdf
          sha256sum resume.pdf
      - name: Commit resume.pdf to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish original-layout V4 PDF resume"
            git push origin HEAD:master
          fi
